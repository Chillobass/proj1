services:
  postgres:
    image: postgres:latest
    container_name: userservice-postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

  userservice:
    build:
      context: ..
      dockerfile: UserService/Dockerfile
    platform: linux/amd64
    container_name: userservice
    environment:
      Postgres__ConnectionString: "Host=postgres;Port=5432;Database=users;Username=postgres;Password=postgres"
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
